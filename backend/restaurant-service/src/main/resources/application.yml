server:
  port: 8082

spring:
  application:
    name: restaurant-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/restaurant_db?createDatabaseIfNotExist=true&serverTimezone=Asia/Kolkata
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    hikari:
      maximum-pool-size: 20
  jackson:
    deserialization:
      # Jackson 3 default is true; missing true/false fields should simply mean false
      fail-on-null-for-primitives: false
  servlet:
    multipart:
      # Phones shrink photos to ~100 KB before uploading; this is only a safety limit
      max-file-size: 3MB
      max-request-size: 3MB
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    hostname: localhost
    instance-id: ${spring.application.name}:${server.port}

app:
  photos:
    # Dish / restaurant photos. Docker keeps them in the "photos" volume (see docker-compose.yml)
    dir: ${PHOTO_DIR:./uploads/photos}
  security:
    gateway-key: ${GATEWAY_KEY:cf-gateway-dev-key-change-me}
    internal-key: ${INTERNAL_KEY:cf-internal-dev-key-change-me}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
