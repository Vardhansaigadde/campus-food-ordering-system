<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Campus Food</title>
  <defs>
    <linearGradient id="cf-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FB923C"/>
      <stop offset=".55" stop-color="#F97316"/>
      <stop offset="1" stop-color="#C2410C"/>
    </linearGradient>
    <linearGradient id="cf-dome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFF1E6"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#cf-bg)"/>
  <!-- soft light from the top-left -->
  <path d="M0 15A15 15 0 0 1 15 0h34a15 15 0 0 1 15 15v6C46 15 18 15 0 27z" fill="#fff" opacity=".1"/>

  <g transform="translate(0 3)">
    <!-- steam -->
    <g fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" opacity=".9">
      <path d="M49 25c-2 2.4 2 4.4 0 7.2"/>
      <path d="M53.2 23.5c-2 2.4 2 4.4 0 7.2"/>
    </g>
    <!-- serving dome + tray -->
    <ellipse cx="32" cy="47.6" rx="20" ry="1.6" fill="#7C2D12" opacity=".25"/>
    <path d="M14.5 41.5a17.5 17.5 0 0 1 35 0z" fill="url(#cf-dome)"/>
    <path d="M20.6 37.2a12.6 12.6 0 0 1 6.2-7.6" fill="none" stroke="#FDBA74" stroke-width="2" stroke-linecap="round"/>
    <rect x="10.5" y="41.5" width="43" height="4.2" rx="2.1" fill="#fff"/>
    <circle cx="32" cy="23.6" r="2.6" fill="#fff"/>
    <!-- graduation cap resting on the dome -->
    <path d="M24.2 15.6v4.6c0 1.4 3.5 2.6 7.8 2.6s7.8-1.2 7.8-2.6v-4.6z" fill="#fff"/>
    <path d="M32 7.4l15.4 6.3L32 20 16.6 13.7z" fill="#fff" stroke="#EA580C" stroke-width="1.1" stroke-linejoin="round"/>
    <path d="M45.6 14.4v6.2" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/>
    <rect x="44.3" y="20" width="2.6" height="3.6" rx="1" fill="#fff"/>
  </g>
</svg>
